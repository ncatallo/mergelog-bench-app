# Reference deploy: plain Docker Compose + Caddy, no control plane.
services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  web:
    build: ../../web
    restart: unless-stopped
    environment:
      API_URL: https://api-compose.bench.nbch-tech.com
      DEPLOYED_WITH: Docker Compose

  api:
    build: ../../api
    restart: unless-stopped
    env_file: .env          # DATABASE_URL, WRITE_TOKEN (never committed)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      retries: 3
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    env_file: .env          # POSTGRES_PASSWORD
    environment: { POSTGRES_USER: bench, POSTGRES_DB: bench }
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bench"]
      interval: 5s

volumes:
  caddy_data:
  pgdata:
